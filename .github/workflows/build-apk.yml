
name: Build GoodLook TV APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
  run: |
    mkdir -p extracted
    unzip -q goodlook-tv.zip -d extracted
    ls -la extracted

- name: Build APK
  run: |
    chmod +x extracted/gradlew
    cd extracted
    ./gradlew assembleDebug
    path: extracted/app/build/outputs/apk/debug/*.apk
