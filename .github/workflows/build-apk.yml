
name: Build GoodLook TV APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q goodlook-tv.zip -d .

      - name: Build APK
        run: |
          chmod +x GoodLookTV/gradlew
          cd GoodLookTV
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoodLook-TV-V2-APK
          path: GoodLookTV/app/build/outputs/apk/debug/*.apk
          
